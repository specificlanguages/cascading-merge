name: Cascading Merge
description: Creates or updates a pull request to merge the current branch into the next one in alphabetic order.

inputs:
  branch_prefix:
    description: >
      Prefix of branches to consider when triggering the workflow or looking for the next branch to cascade to.
    default: "maintenance/mps"
    required: false

  exclude_branch_prefix:
    description: Prefix of branches to exclude from consideration.
    required: false

  merge_prefix:
    description: >
      Prefix to use for merge branches created by the workflow. `branch_prefix` will be stripped before prepending the
      given prefix.
    default: "merge/mps"
    required: false

  default_merge_prefix:
    description: Prefix to use for merge branch for merging to the default branch.
    default: "merge/"
    required: false

  update_from_base:
    description: >
      Whether to update the merge branch from the base branch, as may be required by branch protection rules.
    default: "false"
    required: false

  automerge_new_prs:
    description: >
      Whether to enable automerge for newly created PRs. PRs are merged using 'merge' strategy.
    default: "false"
    required: false

  pr_title:
    description: >
      Title for newly created PRs; existing PRs are not changed. Placeholders `{current_branch}` (the pushed branch),
      `{next_branch}` (the PR base branch) and `{merge_branch}` (the PR head branch) are replaced with branch names.
    default: "Merge {current_branch} into {next_branch}"
    required: false

  pr_body:
    description: >
      Body for newly created PRs; existing PRs are not changed. Supports the same placeholders as `pr_title`. May be
      empty.
    default: "Merge changes from `{current_branch}` to `{next_branch}`."
    required: false

  merge_commit_message:
    description: >
      Commit message for merge commits created when merging `{current_branch}` into an existing `{merge_branch}` that
      cannot be fast-forwarded. Supports the same placeholders as `pr_title`. Empty means the GitHub default message.
    default: ""
    required: false

  update_from_base_message:
    description: >
      Commit message for the reverse merge of `{next_branch}` into `{merge_branch}` (see `update_from_base`). Supports
      the same placeholders as `pr_title`. Empty means the GitHub default message.
    default: ""
    required: false

  token:
    description: >
      GitHub token to use for repository operations. If not specified, the repository token will be used and operations
      performed by the action will not trigger any workflows. In particular, pull request checks will not run for PRs
      created or updated by the action.
    required: false

outputs:
  pr_number:
    description: "Number of the pull request for the merge created or updated by the action"
    value: ${{ steps.create-pr.outputs.pr_number }}

  pr_url:
    description: "URL of the pull request for the merge created or updated by the action"
    value: ${{ steps.create-pr.outputs.pr_url }}

runs:
  using: composite
  steps:
    - id: create-pr
      name: Create PR for new changes in ${{ github.ref_name }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        GH_REPO: ${{ github.repository }}
        branch_prefix: ${{ inputs.branch_prefix }}
        exclude_branch_prefix: ${{ inputs.exclude_branch_prefix }}
        default_merge_prefix: ${{ inputs.default_merge_prefix }}
        merge_prefix: ${{ inputs.merge_prefix }}
        update_from_base: ${{ inputs.update_from_base }}
        automerge_new_prs: ${{ inputs.automerge_new_prs }}
        default_branch: ${{ github.event.repository.default_branch }}
        pr_title_tpl: ${{ inputs.pr_title }}
        pr_body_tpl: ${{ inputs.pr_body }}
        merge_msg_tpl: ${{ inputs.merge_commit_message }}
        update_msg_tpl: ${{ inputs.update_from_base_message }}
      run: |
        jq_expr='.[] | .ref | ltrimstr("refs/heads/") | select(. > "'"$GITHUB_REF_NAME"'")'
        if [[ -n "$exclude_branch_prefix" ]]
        then
          jq_expr+=' | select(startswith("'"$exclude_branch_prefix"'") | not)'
        fi
        jq_expr="[$jq_expr] | min"

        echo "Calculating PR branches:"

        # Next branch matching refs/heads/$branch_prefix, or empty if we're on the last one
        next_maintenance_branch=$(gh api "/repos/{owner}/{repo}/git/matching-refs/heads/$branch_prefix" \
          --jq "$jq_expr")
        echo "  Next maintenance branch: ${next_maintenance_branch:-(none)}"

        # Substitute the default branch if empty
        next_branch=${next_maintenance_branch:-$default_branch}
        echo "  Next branch (PR base branch): $next_branch"

        current_branch="$GITHUB_REF_NAME"

        # Calculate PR head branch name by substituting the branch prefix with the merge prefix
        if [[ "$next_branch" == "$default_branch" ]]
        then
          merge_branch="$default_merge_prefix$default_branch"
        else
          merge_branch=${next_branch/#$branch_prefix/$merge_prefix}
        fi
        echo "  Merge branch (PR head branch): $merge_branch"

        # Replace branch placeholders. Replacements are quoted so that '&' in branch names is taken literally
        # (bash 5.2+ patsub_replacement).
        render() {
          local s="$1"
          s=${s//\{current_branch\}/"$current_branch"}
          s=${s//\{next_branch\}/"$next_branch"}
          s=${s//\{merge_branch\}/"$merge_branch"}
          printf '%s' "$s"
        }

        pr_title=$(render "$pr_title_tpl")
        pr_body=$(render "$pr_body_tpl")
        merge_msg=$(render "$merge_msg_tpl")
        update_msg=$(render "$update_msg_tpl")

        # Merge head ($2) into base ($1). An empty commit message ($3) leaves the message to GitHub.
        merge() {
          local args=(-f base="$1" -f head="$2")
          if [[ -n "$3" ]]
          then
            args+=(-f commit_message="$3")
          fi
          gh api "repos/{owner}/{repo}/merges" --silent --method=POST "${args[@]}"
        }

        echo ""

        echo "Pushing $current_branch to $merge_branch"

        # Create or update $merge_branch
        if gh api "repos/{owner}/{repo}/git/ref/heads/$merge_branch" --silent
        then
          # Branch exists, merge $current_branch into it:

          # First, try fast-forwarding
          echo "Updating $merge_branch to SHA $GITHUB_SHA"
          gh api "repos/{owner}/{repo}/git/refs/heads/$merge_branch" --silent --method=PATCH -f sha="$GITHUB_SHA" \
            -F force=false ||

            # If that failed, try merging
            (echo "Update failed, trying to merge $current_branch into $merge_branch" ;
              merge "$merge_branch" "$current_branch" "$merge_msg") ||

              # If that failed, report an error
              (echo "Merging $current_branch to existing $merge_branch failed, aborting." ; exit 1)
        else
          # Branch does not exist, create it from $current_branch
          gh api "repos/{owner}/{repo}/git/refs" --silent --method=POST -f ref="refs/heads/$merge_branch" -f sha="$GITHUB_SHA" ||
            (echo "Could not create merge branch $merge_branch" ; exit 1)
        fi

        # Update $merge_branch from $next_branch, if requested
        if [[ "$update_from_base" == true ]]
        then
          # The head and base arguments are intentionally reversed because this is a reverse merge.
          merge "$merge_branch" "$next_branch" "$update_msg" ||
            echo "Updating $merge_branch from $next_branch failed, please do it manually."
        fi

        # Create PR if it does not exist yet
        read -r pr_number pr_url < <(gh pr list --head "$merge_branch" --base "$next_branch" \
          --json number,url --jq 'map(.number, .url) | join(" ")')

        if [[ $pr_number ]]
        then
          echo "Found existing PR #$pr_number for $merge_branch -> $next_branch ($pr_url)"
        else
          echo "Creating a new pull request $merge_branch -> $next_branch"
          gh pr create --head "$merge_branch" --base "$next_branch" \
            --title "$pr_title" \
            --body "$pr_body"

          read -r pr_number pr_url < <(gh pr list --head "$merge_branch" --base "$next_branch" \
            --json number,url --jq 'map(.number, .url) | join(" ")')

          if [[ "$automerge_new_prs" == "true" ]]
          then
            echo "Automerging newly created PR #$pr_number"
            gh pr merge --merge --auto "$pr_number" || echo "Automerge failed"
          fi
        fi

        echo "Requesting review on PR #$pr_number from $GITHUB_ACTOR"
        gh api "repos/{owner}/{repo}/pulls/$pr_number/requested_reviewers" \
          --silent --method=POST -f "reviewers[]=$GITHUB_ACTOR" || echo "Could not add $GITHUB_ACTOR as a reviewer"

        echo "Assigning PR #$pr_number to $GITHUB_ACTOR"
        gh api "repos/{owner}/{repo}/issues/$pr_number/assignees" \
          --silent --method=POST -f "assignees[]=$GITHUB_ACTOR" || echo "Could not add $GITHUB_ACTOR as an assignee"

        echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
        echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
